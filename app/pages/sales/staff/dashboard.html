<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Sales - Chick N Pastil</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/assets/sales/shared/style.css">
  <link rel="stylesheet" href="../../assets/css/style.css">
  <style>
    .kpi-card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: box-shadow 0.15s ease;
    }
    .kpi-card:hover {
      box-shadow: 0 4px 18px rgba(30, 86, 49, 0.08);
    }
    .kpi-icon-wrap {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
      flex-shrink: 0;
    }
    .kpi-icon-wrap.green  { background: #e6f4ea; color: #1e5631; }
    .kpi-icon-wrap.blue   { background: #e8f0fe; color: #1a73e8; }
    .kpi-icon-wrap.teal   { background: #e6f9f6; color: #00897b; }
    .kpi-icon-wrap.violet { background: #f0ebff; color: #6c35de; }
    .kpi-value {
      font-size: 1.45rem;
      font-weight: 700;
      color: #111;
      line-height: 1.2;
    }
    .kpi-label {
      font-size: 0.78rem;
      color: #888;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .order-status-badge {
      font-size: 0.73rem;
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: 600;
    }
    .badge-pending   { background: #fff8e1; color: #f59e0b; }
    .badge-preparing { background: #e8f0fe; color: #1a73e8; }
    .badge-completed { background: #e6f4ea; color: #1e5631; }
    .badge-cancelled { background: #fdecea; color: #d32f2f; }
    .quick-nav-card {
      background: #fff;
      border: 1.5px solid var(--border-color);
      border-radius: 14px;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      color: inherit;
      transition: all 0.15s ease;
    }
    .quick-nav-card:hover {
      border-color: var(--primary-green);
      background: #f2faf4;
      color: var(--primary-green);
    }
    .quick-nav-card .icon-box {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: #e6f4ea;
      color: var(--primary-green);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      flex-shrink: 0;
    }
    .section-title {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #aaa;
      margin-bottom: 12px;
    }
    .live-orders-table th {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #999;
      font-weight: 600;
      border-bottom: 1px solid #eee;
    }
    .live-orders-table td {
      font-size: 0.875rem;
      vertical-align: middle;
      border-bottom: 1px solid #f3f3f3;
      padding: 10px 12px;
    }
    #refresh-timer {
      font-size: 0.78rem;
      color: #aaa;
    }
  </style>
</head>
<body data-page-header="Live Sales">

  <div id="topbar-wrapper"></div>
  <div class="app-container">
    <div id="sidebar-wrapper"></div>

  <main class="main-content">

    <!-- Header Row -->
    <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-2">
      <div>
        <h5 class="fw-bold text-dark mb-0">Shift Overview</h5>
        <small class="text-muted" id="shift-date-label">Loading...</small>
      </div>
      <div class="d-flex align-items-center gap-2">
        <span id="refresh-timer"><i class="bi bi-arrow-clockwise me-1"></i>Auto-refresh: <span id="countdown">30</span>s</span>
        <button class="btn btn-sm btn-outline-success rounded-pill px-3" onclick="loadDashboard()">
          <i class="bi bi-arrow-clockwise me-1"></i>Refresh
        </button>
      </div>
    </div>

    <!-- KPI Cards -->
    <div class="row g-3 mb-4" id="kpi-row">
      <div class="col-6 col-md-3">
        <div class="kpi-card">
          <div class="kpi-icon-wrap green"><i class="bi bi-receipt"></i></div>
          <div>
            <div class="kpi-value" id="kpi-orders">—</div>
            <div class="kpi-label">Orders Today</div>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="kpi-card">
          <div class="kpi-icon-wrap blue"><i class="bi bi-cash-stack"></i></div>
          <div>
            <div class="kpi-value" id="kpi-revenue">—</div>
            <div class="kpi-label">Total Revenue</div>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="kpi-card">
          <div class="kpi-icon-wrap teal"><i class="bi bi-wallet2"></i></div>
          <div>
            <div class="kpi-value" id="kpi-cash">—</div>
            <div class="kpi-label">Cash Sales</div>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="kpi-card">
          <div class="kpi-icon-wrap violet"><i class="bi bi-phone"></i></div>
          <div>
            <div class="kpi-value" id="kpi-gcash">—</div>
            <div class="kpi-label">GCash Sales</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Quick Nav -->
    <div class="mb-4">
      <div class="section-title">Quick Actions</div>
      <div class="row g-3">
        <div class="col-12 col-sm-6">
          <a href="/sales/pos/ordering" class="quick-nav-card">
            <div class="icon-box"><i class="bi bi-plus-circle-fill"></i></div>
            <div>
              <div class="fw-semibold text-dark">New Order</div>
              <div class="text-muted small">Create new order</div>
            </div>
          </a>
        </div>
        <div class="col-12 col-sm-6">
          <a href="/sales/staff/transactions" class="quick-nav-card">
            <div class="icon-box"><i class="bi bi-clock-history"></i></div>
            <div>
              <div class="fw-semibold text-dark">Today's Transactions</div>
              <div class="text-muted small">View Recent Sales</div>
            </div>
          </a>
        </div>
      </div>
    </div>

    <!-- Live Orders Table -->
    <div class="bg-white rounded-4 border p-3 p-md-4">
      <div class="d-flex align-items-center justify-content-between mb-3">
        <div class="section-title mb-0">Active Orders</div>
        <span class="badge rounded-pill bg-success bg-opacity-10 text-success fw-semibold" id="active-orders-count">0 active</span>
      </div>
      <div class="table-responsive">
        <table class="table live-orders-table mb-0">
          <thead>
            <tr>
              <th class="ps-2">Order #</th>
              <th>Customer</th>
              <th>Items</th>
              <th class="text-end">Amount</th>
              <th class="text-center">Status</th>
              <th>Time</th>
            </tr>
          </thead>
          <tbody id="live-orders-tbody">
            <tr>
              <td colspan="6" class="text-center py-4 text-muted">
                <div class="spinner-border spinner-border-sm text-success me-2" role="status"></div>
                Loading orders...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/shared/bars.js"></script>
  <script>
    let countdownVal = 30;
    let countdownInterval;

    function fmt(n) {
      return 'Php ' + Number(n || 0).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function statusBadge(status) {
      const map = {
        'Pending':   'badge-pending',
        'Preparing': 'badge-preparing',
        'Completed': 'badge-completed',
        'Cancelled': 'badge-cancelled'
      };
      return `<span class="order-status-badge ${map[status] || 'badge-pending'}">${status}</span>`;
    }

    function formatTime(dt) {
      if (!dt) return '—';
      const d = new Date(dt);
      return d.toLocaleTimeString('en-PH', { hour: '2-digit', minute: '2-digit' });
    }

    async function loadDashboard() {
      const user = (window.getCurrentUser && window.getCurrentUser()) || { branch: '' };
      const branch = user.branch || 'Balagtas';

      // Date label
      const now = new Date();
      document.getElementById('shift-date-label').textContent =
        now.toLocaleDateString('en-PH', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }) +
        ' · ' + branch + ' Branch';

      // Reset countdown
      countdownVal = 30;
      document.getElementById('countdown').textContent = countdownVal;

      try {
        const res = await fetch(`/api/dashboard/stats?branch=${encodeURIComponent(branch)}`);
        const data = await res.json();

        document.getElementById('kpi-orders').textContent   = data.total_orders   ?? '0';
        document.getElementById('kpi-revenue').textContent  = fmt(data.total_revenue);
        document.getElementById('kpi-cash').textContent     = fmt(data.total_cash);
        document.getElementById('kpi-gcash').textContent    = fmt(data.total_gcash);

      } catch (err) {
        console.warn('Stats fetch failed:', err);
      }

      // Load recent/active orders (today's, non-cancelled)
      try {
        const res2 = await fetch(`/api/orders?branch=${encodeURIComponent(branch)}&today=1`);
        const data2 = await res2.json();
        const orders = Array.isArray(data2) ? data2 : (data2.orders || []);

        const active = orders.filter(o => o.order_status !== 'Cancelled' && o.order_status !== 'Completed');
        document.getElementById('active-orders-count').textContent = `${active.length} active`;

        const tbody = document.getElementById('live-orders-tbody');
        if (orders.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-muted small">No orders yet for today.</td></tr>`;
          return;
        }

        // Show most recent 20 orders
        tbody.innerHTML = orders.slice(0, 20).map(o => `
          <tr>
            <td class="ps-2 fw-semibold text-dark">#${o.order_id}</td>
            <td>${o.cust_name || 'Walk-in'}</td>
            <td class="text-muted small">${o.notes || '—'}</td>
            <td class="text-end fw-semibold">${fmt(o.order_total)}</td>
            <td class="text-center">${statusBadge(o.order_status)}</td>
            <td class="text-muted small">${formatTime(o.order_datetime)}</td>
          </tr>
        `).join('');

      } catch (err) {
        document.getElementById('live-orders-tbody').innerHTML =
          `<tr><td colspan="6" class="text-center py-3 text-muted small">Could not load orders. Is the server running?</td></tr>`;
      }
    }

    function startCountdown() {
      clearInterval(countdownInterval);
      countdownInterval = setInterval(() => {
        countdownVal--;
        const el = document.getElementById('countdown');
        if (el) el.textContent = countdownVal;
        if (countdownVal <= 0) {
          loadDashboard();
        }
      }, 1000);
    }

    document.addEventListener('DOMContentLoaded', () => {
      // Guard: staff only
      const user = window.getCurrentUser ? window.getCurrentUser() : null;
      if (user && user.role === 'Manager') {
        window.location.href = '/sales/manager/dashboard';
        return;
      }
      loadDashboard();
      startCountdown();
    });
  </script>
</body>
</html>
